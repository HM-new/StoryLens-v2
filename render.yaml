services:
  - type: web
    name: storylens-v2
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_PROVIDER
        value: gemini
      - key: GEMINI_BACKUP_MODELS
        value: gemini-2.5-flash-lite,gemini-2.0-flash
      - key: GEMINI_PHASE1_MAX_ATTEMPTS
        value: 3
      - key: GEMINI_PHASE1_RETRY_DELAY_MS
        value: 15000
